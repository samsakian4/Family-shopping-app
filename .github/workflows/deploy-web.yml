name: Deploy Web Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Install dependencies
        run: |
          if ! flutter pub get 2>&1 | tee step.log; then
            while IFS= read -r line; do echo "::error::$line"; done < step.log
            exit 1
          fi

      - name: Generate code
        run: |
          if ! dart run build_runner build --delete-conflicting-outputs 2>&1 | tee step.log; then
            while IFS= read -r line; do echo "::error::$line"; done < step.log
            exit 1
          fi

      # This project's anon/publishable Supabase key — safe to embed, see
      # scripts/build_web.sh for why (it's designed to live in client code;
      # data safety comes from RLS, not from hiding this key).
      - name: Build web (release)
        run: |
          if ! flutter build web --release \
              --base-href "/Family-shopping-app/" \
              --dart-define=SUPABASE_URL="https://ybzjwtyhvvqyrbfungdu.supabase.co" \
              --dart-define=SUPABASE_ANON_KEY="sb_publishable_QT157jLQT90SvWVt1v7s-g_SIyCJFw2" \
              --dart-define=FLAVOR=production 2>&1 | tee step.log; then
            while IFS= read -r line; do echo "::error::$line"; done < step.log
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - id: deployment
        uses: actions/deploy-pages@v4
