name: Build Android APK (debug)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Install dependencies
        run: |
          if ! flutter pub get 2>&1 | tee step.log; then
            while IFS= read -r line; do echo "::error::$line"; done < step.log
            exit 1
          fi

      - name: Generate code
        run: |
          if ! dart run build_runner build --delete-conflicting-outputs 2>&1 | tee step.log; then
            while IFS= read -r line; do echo "::error::$line"; done < step.log
            exit 1
          fi

      # The android/ folder was hand-scaffolded (no local Flutter SDK was
      # available to run `flutter create`), so it has no committed Gradle
      # wrapper jar — generate one fresh using the Gradle already
      # installed on the runner instead of trying to hand-author a binary.
      - name: Generate Gradle wrapper
        run: |
          cd android
          if ! gradle wrapper --gradle-version 8.7 2>&1 | tee ../step.log; then
            while IFS= read -r line; do echo "::error::$line"; done < ../step.log
            exit 1
          fi

      # This project's anon/publishable Supabase key — safe to embed, see
      # scripts/run_dev.sh for why.
      - name: Build debug APK
        run: |
          if ! flutter build apk --debug \
              --dart-define=SUPABASE_URL="https://ybzjwtyhvvqyrbfungdu.supabase.co" \
              --dart-define=SUPABASE_ANON_KEY="sb_publishable_QT157jLQT90SvWVt1v7s-g_SIyCJFw2" \
              --dart-define=FLAVOR=development 2>&1 | tee step.log; then
            while IFS= read -r line; do echo "::error::$line"; done < step.log
            exit 1
          fi
          while IFS= read -r line; do echo "::notice::$line"; done < step.log

      - uses: actions/upload-artifact@v4
        with:
          name: family-shopping-app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
