plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin
    // Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.familyshoppingapp.app"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        // Family Shopping Assistant — Milestone 1 test build (24_README.md).
        applicationId "com.familyshoppingapp.app"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        // versionCode/versionName come from pubspec.yaml's `version:` field
        // automatically via the Flutter Gradle plugin — no manual
        // local.properties parsing needed (that's what caused the "only
        // buildscript{}/pluginManagement{}/plugins{} allowed before
        // plugins{}" syntax error: this file used to read local.properties
        // BEFORE its plugins{} block, which Gradle's modern plugins DSL
        // does not allow).
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    buildTypes {
        release {
            // TODO(release-signing): replace with a real release keystore
            // before ever publishing — debug signing is only for this
            // internal test build (08_SECURITY.md / 21_DEPLOYMENT...md
            // both assume a real signing config for production).
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source "../.."
}
